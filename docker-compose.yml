services:
  postgres:
    image: postgres:16-alpine
    container_name: estv2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-estv2}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-estv2password}
      POSTGRES_DB: ${POSTGRES_DB:-estv2_db}
      TZ: ${TZ:-Asia/Bangkok}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-estv2} -d ${POSTGRES_DB:-estv2_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: estv2-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-estv2}:${POSTGRES_PASSWORD:-estv2password}@postgres:5432/${POSTGRES_DB:-estv2_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-htc-estv2-super-secret-jwt-key-2026}
      AUTO_SEED: ${AUTO_SEED:-true}
      NODE_ENV: production
      PORT: 3000
      TZ: ${TZ:-Asia/Bangkok}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ./public/img:/app/public/img
      - ./public/uploads:/app/public/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
